<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Grounds — Mango Rave AR Menu</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #FBF8F2;
    color: #2B2B2B;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .logo-badge {
    width: 90px; height: 90px; border-radius: 50%;
    border: 1px solid #7B2D8E;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    font-family: Georgia, serif;
    font-size: 13px; letter-spacing: 2px; text-align: center;
    color: #2B2B2B;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-align: center;
  }
  .tagline {
    font-size: 13px;
    color: #6b6b6b;
    letter-spacing: 2px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  .product-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  model-viewer {
    width: 100%;
    height: 340px;
    border-radius: 12px;
    background: #F4EFE3;
    --poster-color: transparent;
   ar-scale="fixed";
   scale="0.5 0.5 0.5";
  }
  .product-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .product-name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .product-price {
    font-size: 16px;
    font-weight: 600;
    color: #4B8B3F;
  }
  .ar-hint {
    margin-top: 8px;
    font-size: 12px;
    color: #9a9a9a;
    text-align: center;
  }
  .ar-button {
    position: relative;
    background: #4B8B3F;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    display: block;
    margin: 14px auto 0;
    cursor: pointer;
  }
  footer {
    margin-top: 30px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="logo-badge">FRESH<br>GROUNDS</div>
  <h1>Mango Rave</h1>
  <div class="tagline">Point your camera. See it in 3D.</div>

  <div class="product-card">
    <model-viewer
      src="https://d8j0ntlcm91z4.cloudfront.net/user_3HJs6WXwxJXW0yvl9AWfmGFjK8V/hf_20260805_223709_5d40f77a-72d2-44b2-9823-3f9aa862fde0.glb"
      alt="Mango Kunafa 3D model"
      camera-controls
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1"
      exposure="1.1"
      poster="">
      <button slot="ar-button" class="ar-button">View in AR on your table</button>
    </model-viewer>

    <div class="product-info">
      <span class="product-name">Mango Kunafa</span>
      <span class="product-price">PKR 1200</span>
    </div>
    <div class="ar-hint">Tap and drag to rotate · Tap the button to place it on your table</div>
  </div>

  <footer>Fresh Grounds · DHA Phase 6 &amp; Gulberg, Lahore</footer>

</body>
</html>
